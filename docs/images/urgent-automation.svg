<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#F7F7F3"/>
  <style>text{font-family:Arial,sans-serif}.title{font-size:58px;font-weight:700;fill:#17181B}.sub{font-size:24px;font-weight:400;fill:#62656D}.h{font-size:26px;font-weight:700;fill:#17181B}.p{font-size:20px;font-weight:400;fill:#62656D}.tag{font-size:18px;font-weight:700;letter-spacing:1px;fill:#5A55E7}.box{fill:#FFF;stroke:#DADAE2;stroke-width:2}.line{stroke:#7B77F0;stroke-width:5;fill:none}.ok{fill:#E6F7EF;stroke:#1C9A69;stroke-width:2}</style>
  <text x="110" y="115" class="tag">RESTAMENU · URGENT REQUEST AUTOMATION</text>
  <text x="110" y="185" class="title">One insert. One alert. No database key in n8n.</text>
  <text x="110" y="230" class="sub">Enrichment and filtering happen before the payload leaves Postgres.</text>
  <rect x="85" y="355" width="260" height="190" rx="26" class="box"/><text x="120" y="420" class="h">Urgent request</text><text x="120" y="462" class="p">Product · quantity</text><text x="120" y="495" class="p">restaurant_id · creator</text>
  <rect x="450" y="325" width="300" height="250" rx="26" class="box"/><text x="490" y="390" class="h">Postgres trigger</text><text x="490" y="432" class="p">WHEN priority = urgent</text><text x="490" y="465" class="p">JOIN product + profile</text><text x="490" y="498" class="p">URL from Supabase Vault</text><rect x="490" y="520" width="175" height="38" rx="19" class="ok"/><text x="516" y="546" class="tag" style="fill:#167A54">PG_NET</text>
  <rect x="855" y="355" width="260" height="190" rx="26" class="box"/><text x="895" y="420" class="h">n8n</text><text x="895" y="462" class="p">Receives ready payload</text><text x="895" y="495" class="p">No Supabase credential</text>
  <rect x="1220" y="355" width="295" height="190" rx="26" class="box"/><text x="1260" y="420" class="h">Telegram</text><text x="1260" y="462" class="p">Product · quantity</text><text x="1260" y="495" class="p">Restaurant · requester</text>
  <path d="M345 450H450M750 450H855M1115 450H1220" class="line"/><path d="M430 435l20 15-20 15M835 435l20 15-20 15M1200 435l20 15-20 15" class="line"/>
  <text x="110" y="700" class="h">The first version made a security anti-pattern:</text><text x="110" y="745" class="sub">Supabase → n8n → Supabase, using a service_role key that bypasses RLS.</text>
  <text x="110" y="800" class="h">The fix removed the round trip and the credential.</text><text x="1360" y="830" class="tag">@GEORGYPEVCHIKH</text>
</svg>
